<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title> 
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 30px;
      }
      input { 
        padding: 8px;
        font-size: 16px;
        width: 250px;
      }
      button {
        padding: 8px 15px;
        font-size: 26px;
        cursor: pointer;
      }
      #thongBao {
        margin-top: 15px;
        font-size: 26px;
        font-weight: bold;
      }
    </style>
</head>
<body>
    <form id="formGui">
  <h1> Đăng kí thẻ thành viên</h1>  
  <form id="Ten">
  <h3> Họ và Tên </h3>
      <input type="text" id="Ten" placeholder="không để trống, tối thiểu 3 ký tự (sau khi cắt khoảng trắng)" />
    <h3> Email</h3>
    <form  id="Email">
      <input type="text" id="Email" placeholder=": đúng định dạng email." />
 <h3> Số Điện Thoại </h3>
    <form  id="sdt">
      <input type="text" id="sdt " placeholder=": Nhập 10 số (bắt đầu bằng 0)" />
    <h3> Số khách thường đi cùng </h3>
<div class="col-md-6">
              <div class="form-floating">
                <input type="number" class="form-control" id="soNguoi" placeholder="Số người" min="1" max="20" required>
                <label for="soNguoi">Số người</label>
              </div>
            </div>
             <button type="submit">Gửi đi</button>
              </form>
 <!-- Nơi hiển thị thông báo kết quả -->
    <p id="thongBao"></p>
    <script>
      // 1. Lấy các phần tử trên trang
      const form = document.querySelector("#formGui");
      const oSdt = document.querySelector("#sdt");
      const thongBao = document.querySelector("#thongBao");
      const Ten  = document.querySelector("#Ten");
      const email = document.querySelector("#Email");
       const nguoiDung = document.querySelector("#nguoiDung");
      // Mẫu kiểm tra: 10 chữ số, bắt đầu bằng 0
      const MAU_SDT = /^0\d{9}$/;
// kiem tra ho ten 
       
      // 2. Bắt sự kiện khi ấn nút gửi
      form.addEventListener("submit", function (event) {
        event.preventDefault(); // Chặn tải lại trang

        const sdt = oSdt.value.trim(); // Lấy giá trị và xóa khoảng trắng thừa

        // 3. Kiểm tra định dạng
        if (MAU_SDT.test(sdt)) {
          // ĐÚNG: Hiện thông tin đã gửi đi (màu xanh lá)
          thongBao.style.color = "green";
          thongBao.textContent = "Thông tin đã gửi đi thành công!";
        } else {
          // SAI: Thông báo lỗi (màu đỏ)
          thongBao.style.color = "red";
          thongBao.textContent =
            "Số điện thoại sai định dạng! Vui lòng nhập lại.";
             if (Ten.test(Ten)) {
          // ĐÚNG: Hiện thông tin đã gửi đi (màu xanh lá)
          thongBao.style.color = "green";
          thongBao.textContent = "Thông tin đã gửi đi thành công!";
        } else {
          // SAI: Thông báo lỗi (màu đỏ)
          thongBao.style.color = "red";
          thongBao.textContent =
            "Họ tên sai định dạng! Vui lòng nhập lại.";
 if (email.test(email)) {
          // ĐÚNG: Hiện thông tin đã gửi đi (màu xanh lá)
          thongBao.style.color = "green";
          thongBao.textContent = "Thông tin đã gửi đi thành công!";
        } else {
          // SAI: Thông báo lỗi (màu đỏ)
          thongBao.style.color = "red";
          thongBao.textContent =
            "Email sai định dạng! Vui lòng nhập lại.";
          // ⭐ Chuyển con trỏ chuột quay lại ô nhập để người dùng gõ lại ngay
          oSdt.focus();
          oSdt.select(); // Bôi đen sẵn chữ số cũ để người dùng tiện xóa/sửa
        }
        ;
    </script>
</body>
</html>
