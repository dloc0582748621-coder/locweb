
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký thẻ thành viên</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        #thongBao {
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Đăng ký thẻ thành viên</h1>

    <form id="formGui" novalidate>

        <div class="mb-3">
            <h3>Họ và Tên</h3>
            <input type="text" class="form-control" id="Ten"
                placeholder="Không để trống, tối thiểu 3 ký tự">

            <div class="invalid-feedback">
                Họ tên phải có ít nhất 3 ký tự.
            </div>
        </div>

        <div class="mb-3">
            <h3>Email</h3>
            <input type="text" class="form-control" id="Email"
                placeholder="Nhập email">

            <div class="invalid-feedback">
                Email không đúng định dạng.
            </div>
        </div>

        <div class="mb-3">
            <h3>Số Điện Thoại</h3>
            <input type="text" class="form-control" id="sdt"
                placeholder="Nhập 10 số, bắt đầu bằng 0">

            <div class="invalid-feedback">
                Số điện thoại phải có 10 số và bắt đầu bằng 0.
            </div>
        </div>

        <div class="mb-3">
            <h3>Số khách thường đi cùng</h3>

            <input type="number" class="form-control"
                id="soNguoi" min="1" max="20"
                placeholder="Nhập số người">

            <div class="invalid-feedback">
                Số người phải từ 1 đến 20.
            </div>
        </div>

        <button type="submit" class="btn btn-primary">
            Gửi đi
        </button>

    </form>

    <p id="thongBao"></p>
</div>

<script>
    // 1. Lấy các phần tử
    const form = document.querySelector("#formGui");
    const Ten = document.querySelector("#Ten");
    const email = document.querySelector("#Email");
    const oSdt = document.querySelector("#sdt");
    const soNguoi = document.querySelector("#soNguoi");
    const thongBao = document.querySelector("#thongBao");

    // 2. Các mẫu kiểm tra
    const MAU_SDT = /^0\d{9}$/;
    const MAU_EMAIL = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    // 3. Kiểm tra khi nhấn nút gửi
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        // Xóa thông báo lỗi cũ
        const inputs = [Ten, email, oSdt, soNguoi];

        inputs.forEach(function(input) {
            input.classList.remove("is-invalid");
        });

        thongBao.textContent = "";

        // Kiểm tra họ tên
        if (Ten.value.trim().length < 3) {
            Ten.classList.add("is-invalid");
            thongBao.style.color = "red";
            thongBao.textContent = "Họ tên không hợp lệ!";
            Ten.focus();
            return;
        }

        // Kiểm tra email
        if (!MAU_EMAIL.test(email.value.trim())) {
            email.classList.add("is-invalid");
            thongBao.style.color = "red";
            thongBao.textContent = "Email không hợp lệ!";
            email.focus();
            return;
        }

        // Kiểm tra số điện thoại
        if (!MAU_SDT.test(oSdt.value.trim())) {
            oSdt.classList.add("is-invalid");
            thongBao.style.color = "red";
            thongBao.textContent = "Số điện thoại không hợp lệ!";
            oSdt.focus();
            return;
        }

        // Kiểm tra số người
        const so = Number(soNguoi.value);

        if (
            soNguoi.value.trim() === "" ||
            !Number.isInteger(so) ||
            so < 1 ||
            so > 20
        ) {
            soNguoi.classList.add("is-invalid");
            thongBao.style.color = "red";
            thongBao.textContent = "Số người phải từ 1 đến 20!";
            soNguoi.focus();
            return;
        }

        // Nếu tất cả đều đúng
        thongBao.style.color = "green";
        thongBao.textContent = "Thông tin đã gửi đi thành công!";

    });
</script>

</body>
</html>
