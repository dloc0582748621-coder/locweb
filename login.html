<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng nhập - Smart Tro Pro</title>
<style>
:root{
    --primary:#2563eb;
    --primary-dark:#1d4ed8;
    --dark:#0f172a;
    --dark-2:#1e293b;
    --bg:#f1f5f9;
    --text:#334155;
    --muted:#64748b;
    --border:#e2e8f0;
    --success:#10b981;
    --danger:#ef4444;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;}
body{
    min-height:100vh;
    background:linear-gradient(135deg,var(--dark) 0%,var(--dark-2) 55%,#1e3a8a 100%);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}
.login-box{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:16px;
    padding:34px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35);
}
.brand{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:24px;
    text-align:center;
}
.brand-icon{
    width:56px;height:56px;border-radius:14px;
    background:linear-gradient(135deg,#38bdf8,#2563eb);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;margin-bottom:12px;
}
.brand h1{color:var(--dark);font-size:22px;}
.brand p{color:var(--muted);font-size:13px;margin-top:4px;}
.tabs{
    display:grid;grid-template-columns:1fr 1fr;
    background:#f1f5f9;border-radius:9px;padding:4px;margin-bottom:20px;
}
.tabs button{
    border:0;background:none;padding:9px;border-radius:7px;
    font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;
}
.tabs button.active{background:white;color:var(--primary);box-shadow:0 1px 3px rgba(0,0,0,.12);}
.form-group{margin-bottom:15px;}
.form-group label{display:block;margin-bottom:6px;color:#475569;font-size:13px;font-weight:600;}
.input-wrap{position:relative;}
.input-wrap input{
    width:100%;border:1px solid var(--border);border-radius:8px;
    padding:11px 42px 11px 12px;font-size:14px;outline:none;
}
.input-wrap input:focus{border-color:var(--primary);box-shadow:0 0 0 3px #dbeafe;}
.toggle-pass{
    position:absolute;right:6px;top:50%;transform:translateY(-50%);
    border:0;background:none;cursor:pointer;font-size:16px;padding:6px;
}
.options{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:18px;font-size:13px;
}
.options label{display:flex;align-items:center;gap:7px;cursor:pointer;}
.msg{
    display:none;padding:11px 12px;border-radius:8px;
    font-size:13px;margin-bottom:15px;
}
.msg.error{display:block;background:#fee2e2;color:#b91c1c;}
.msg.ok{display:block;background:#d1fae5;color:#047857;}
.btn{
    width:100%;border:0;border-radius:8px;padding:12px;
    background:var(--primary);color:white;font-size:15px;font-weight:700;cursor:pointer;
    transition:.2s;
}
.btn:hover{background:var(--primary-dark);}
.hint{
    margin-top:18px;padding:12px;border:1px dashed #cbd5e1;border-radius:8px;
    background:#f8fafc;font-size:12px;color:var(--muted);line-height:1.6;
}
.hidden{display:none;}
.footer{text-align:center;margin-top:18px;font-size:12px;color:#94a3b8;}
</style>
</head>
<body>

<div class="login-box">

    <div class="brand">
        <div class="brand-icon">⚡</div>
        <h1>Smart Tro Pro</h1>
        <p>Hệ thống quản lý nhà trọ</p>
    </div>

    <div class="tabs">
        <button type="button" id="tabLogin" class="active">Đăng nhập</button>
        <button type="button" id="tabRegister">Tạo tài khoản</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- ĐĂNG NHẬP -->
    <form id="loginForm" autocomplete="on">

        <div class="form-group">
            <label for="loginUser">Tên đăng nhập</label>
            <div class="input-wrap">
                <input id="loginUser" type="text" placeholder="Nhập tên đăng nhập" autocomplete="username">
            </div>
        </div>

        <div class="form-group">
            <label for="loginPass">Mật khẩu</label>
            <div class="input-wrap">
                <input id="loginPass" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
                <button type="button" class="toggle-pass" data-target="loginPass" title="Hiện/ẩn mật khẩu">👁️</button>
            </div>
        </div>

        <div class="options">
            <label><input type="checkbox" id="remember"> Ghi nhớ đăng nhập</label>
        </div>

        <button type="submit" class="btn">Đăng nhập</button>

        <div class="hint">
            <strong>Tài khoản mẫu:</strong><br>
            Tên đăng nhập: <b>admin</b><br>
            Mật khẩu: <b>123456</b>
        </div>

    </form>

    <!-- TẠO TÀI KHOẢN -->
    <form id="registerForm" class="hidden" autocomplete="off">

        <div class="form-group">
            <label for="regName">Họ và tên</label>
            <div class="input-wrap">
                <input id="regName" type="text" placeholder="Nguyễn Văn A">
            </div>
        </div>

        <div class="form-group">
            <label for="regUser">Tên đăng nhập</label>
            <div class="input-wrap">
                <input id="regUser" type="text" placeholder="Ít nhất 4 ký tự" autocomplete="username">
            </div>
        </div>

        <div class="form-group">
            <label for="regPass">Mật khẩu</label>
            <div class="input-wrap">
                <input id="regPass" type="password" placeholder="Ít nhất 6 ký tự" autocomplete="new-password">
                <button type="button" class="toggle-pass" data-target="regPass" title="Hiện/ẩn mật khẩu">👁️</button>
            </div>
        </div>

        <div class="form-group">
            <label for="regPass2">Nhập lại mật khẩu</label>
            <div class="input-wrap">
                <input id="regPass2" type="password" placeholder="Nhập lại mật khẩu" autocomplete="new-password">
            </div>
        </div>

        <button type="submit" class="btn">Tạo tài khoản</button>

    </form>

    <div class="footer">Smart Tro Pro © 2026</div>

</div>

<script>
/* =====================================================
   CẤU HÌNH
===================================================== */

const USERS_KEY   = "smartTroUsers";
const SESSION_KEY = "smartTroSession";
const HOME_PAGE   = "smart_tro_pro.html";   // trang quản lý sau khi đăng nhập


/* =====================================================
   TIỆN ÍCH
===================================================== */

const $ = id => document.getElementById(id);

function showMsg(text, type){
    const box = $("msg");
    box.textContent = text;
    box.className = "msg " + type;
}

function clearMsg(){
    $("msg").className = "msg";
    $("msg").textContent = "";
}

// Mã hóa mật khẩu (không lưu mật khẩu gốc)
async function hashPassword(text){
    try{
        const bytes = new TextEncoder().encode("smart-tro:" + text);
        const buf = await crypto.subtle.digest("SHA-256", bytes);
        return Array.from(new Uint8Array(buf))
            .map(b => b.toString(16).padStart(2,"0")).join("");
    }catch(e){
        // Trình duyệt không hỗ trợ -> dùng cách đơn giản hơn
        return "b64:" + btoa(unescape(encodeURIComponent(text)));
    }
}

function getUsers(){
    try{
        return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
    }catch(e){
        return [];
    }
}

function saveUsers(users){
    localStorage.setItem(USERS_KEY, JSON.stringify(users));
}

// Tạo sẵn tài khoản mẫu admin / 123456 nếu chưa có
async function ensureDefaultUser(){
    const users = getUsers();
    if(users.some(u => u.username === "admin")) return;

    users.push({
        username:"admin",
        fullName:"Nguyễn Văn A",
        passHash:await hashPassword("123456")
    });
    saveUsers(users);
}

function startSession(user, remember){
    const session = JSON.stringify({
        username:user.username,
        fullName:user.fullName,
        loginAt:Date.now()
    });

    // Ghi nhớ -> giữ lại khi tắt trình duyệt; không ghi nhớ -> mất khi đóng tab
    if(remember){
        localStorage.setItem(SESSION_KEY, session);
        sessionStorage.removeItem(SESSION_KEY);
    }else{
        sessionStorage.setItem(SESSION_KEY, session);
        localStorage.removeItem(SESSION_KEY);
    }
}

function hasSession(){
    return !!(sessionStorage.getItem(SESSION_KEY) ||
              localStorage.getItem(SESSION_KEY));
}


/* =====================================================
   CHUYỂN TAB
===================================================== */

function switchTab(mode){
    clearMsg();
    const isLogin = mode === "login";

    $("loginForm").classList.toggle("hidden", !isLogin);
    $("registerForm").classList.toggle("hidden", isLogin);
    $("tabLogin").classList.toggle("active", isLogin);
    $("tabRegister").classList.toggle("active", !isLogin);
}

$("tabLogin").addEventListener("click", () => switchTab("login"));
$("tabRegister").addEventListener("click", () => switchTab("register"));


/* =====================================================
   HIỆN / ẨN MẬT KHẨU
===================================================== */

document.querySelectorAll(".toggle-pass").forEach(btn => {
    btn.addEventListener("click", () => {
        const input = $(btn.dataset.target);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.textContent = show ? "🙈" : "👁️";
    });
});


/* =====================================================
   ĐĂNG NHẬP
===================================================== */

$("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    clearMsg();

    const username = $("loginUser").value.trim().toLowerCase();
    const password = $("loginPass").value;

    if(!username || !password){
        showMsg("Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu.", "error");
        return;
    }

    const passHash = await hashPassword(password);
    const user = getUsers().find(
        u => u.username === username && u.passHash === passHash
    );

    if(!user){
        showMsg("Tên đăng nhập hoặc mật khẩu không đúng.", "error");
        return;
    }

    startSession(user, $("remember").checked);
    showMsg("Đăng nhập thành công! Đang chuyển trang...", "ok");

    setTimeout(() => { window.location.href = HOME_PAGE; }, 700);
});


/* =====================================================
   TẠO TÀI KHOẢN
===================================================== */

$("registerForm").addEventListener("submit", async e => {
    e.preventDefault();
    clearMsg();

    const fullName = $("regName").value.trim();
    const username = $("regUser").value.trim().toLowerCase();
    const pass     = $("regPass").value;
    const pass2    = $("regPass2").value;

    if(!fullName || !username || !pass || !pass2){
        showMsg("Vui lòng nhập đầy đủ thông tin.", "error");
        return;
    }

    if(username.length < 4){
        showMsg("Tên đăng nhập phải có ít nhất 4 ký tự.", "error");
        return;
    }

    if(pass.length < 6){
        showMsg("Mật khẩu phải có ít nhất 6 ký tự.", "error");
        return;
    }

    if(pass !== pass2){
        showMsg("Hai mật khẩu nhập vào không giống nhau.", "error");
        return;
    }

    const users = getUsers();

    if(users.some(u => u.username === username)){
        showMsg("Tên đăng nhập này đã có người dùng.", "error");
        return;
    }

    users.push({
        username,
        fullName,
        passHash:await hashPassword(pass)
    });
    saveUsers(users);

    $("registerForm").reset();
    switchTab("login");
    $("loginUser").value = username;
    showMsg("Tạo tài khoản thành công! Hãy đăng nhập.", "ok");
});


/* =====================================================
   KHỞI ĐỘNG
===================================================== */

(async function init(){
    await ensureDefaultUser();

    // Đã đăng nhập rồi thì vào thẳng trang quản lý
    if(hasSession()){
        window.location.href = HOME_PAGE;
    }
})();
</script>

</body>
</html>
