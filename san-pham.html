<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Danh sách điện thoại và laptop tại TechWorld, có lọc, tìm kiếm và sắp xếp theo giá.">
  <title>Sản phẩm - TechWorld</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-trang="san-pham">
  <div id="dauTrang"></div>

  <main class="container py-4">
    <nav aria-label="breadcrumb"><ol class="breadcrumb"><li class="breadcrumb-item"><a href="index.html">Trang chủ</a></li><li class="breadcrumb-item active" aria-current="page">Sản phẩm</li></ol></nav>
    <h1 class="tieu-de-muc h2">Tất cả sản phẩm</h1>

    <div class="row g-2 align-items-center mb-4">
      <div class="col-lg-5">
        <div class="btn-group" role="group" aria-label="Lọc theo loại">
          <button type="button" class="btn btn-outline-primary active" data-loai="all">Tất cả</button>
          <button type="button" class="btn btn-outline-primary" data-loai="phone">Điện thoại</button>
          <button type="button" class="btn btn-outline-primary" data-loai="laptop">Laptop</button>
        </div>
      </div>
      <div class="col-lg-4">
        <label for="oTim" class="visually-hidden">Tìm sản phẩm</label>
        <input type="search" id="oTim" class="form-control" placeholder="Tìm theo tên hoặc hãng...">
      </div>
      <div class="col-lg-3">
        <label for="oSapXep" class="visually-hidden">Sắp xếp</label>
        <select id="oSapXep" class="form-select">
          <option value="">Sắp xếp: mặc định</option>
          <option value="tang">Giá tăng dần</option>
          <option value="giam">Giá giảm dần</option>
        </select>
      </div>
    </div>

    <p class="text-secondary small">Hiển thị <strong id="demSP">0</strong> sản phẩm</p>
    <div class="row g-3" id="luoiSP"></div>
    <div id="khongCo" class="alert alert-info d-none mt-3">Không tìm thấy sản phẩm phù hợp. Hãy thử từ khoá khác.</div>
  </main>

  <div id="chanTrang"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
